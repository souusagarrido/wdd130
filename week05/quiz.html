<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"  content="width=device-width, initial-scale=1.0">
    <title>Jessica Garrido | Online Quiz</title>
    <link rel="stylesheet" href="styles/quiz.css">
</head>
<body>
    <header>
        <h1>Basic HTML and CSS Quiz</h1>
    </header>
    <main class="box">
        <form class="box">
            <div class="form-item">
                <label for="q1">1. What does the acronym CSS stand for?</label>
                <input type="text" id="q1" name="q1" placeholder="Fill in the blank">
            </div>

            <div class="form-item box">
                <label for="q2">2. Briedly explain the puurpose of a CSS selector:</label>
                <textarea id="q2" name="q2" rows="4" placeholder="Fill in the blank"></textarea>
            </div>

            <div class="form-item box">
                <label for="q3">3. Which of the following is a valid CSS comment?</label>.
                <select  id="q3" name="q3">
                    <option value="" selected disabled>Choose One...</option>
                    <option value="a">A. &lt; !.. This is a comment ..&gt;</option>
                    <option value="b">B. /* This is a comment/*</option>
                    <option value="c">C. // This is a comment</option>
                </select>
            </div>

            <div class="form-item box">
                <label for="q4">4. What is the bottoom margin given this declaration? </label>
                <code class box>margin: 10px 5px 15px;</code>
                <input type="number" id="q4" name="q4">
            </div>

            <div class="form-item">
                <button type="submit">Submit Quiz for Grading</button>
            </div>
        </form>
    </main>
    <footer>
         <p>©2026 Jessica Garrido
    </footer>
</body>
</html>
