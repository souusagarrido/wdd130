<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> Contact Us| White Water Rafting  </title>
    <meta name="description" content="Have questions about our white water rafting trips? Get in touch with us via our contact form, find our location or meet our team.">
    <meta name="author" content="Jessica Garrido">
    <link rel="stylesheet" href="styles/rafting.css">

</head>

<body>
    <header>
        <img src="images/logo1.png" alt="Rafting Logo">

        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About Us</a>
            <a href="trips.html">Trips</a>
            <a href="contact.html">Contact Us</a>
        </nav>
    </header>

    <main>
        <section class="contact-info">
            <div class="address-card">
                <h2>White Water Rafting</h2>
                <p>123 Main River Street<br>Kolob, California</p>
                <p>Phone: +1 999 999 9999</p>
                <p>Email: info@whitewater.com</p>
            </div>

            <div class="map-container">
                <iframe src="https://www.google.com/maps/search/kolobc,+California/@36.9351483,-125.2831043,14z/data=!4m2!2m1!6e1?entry=ttu&g_ep=EgoyMDI2MDQwMS4wIKXMDSoASAFQAw%3D%3D" width="=600" height="450"></iframe>
            </div>

        </section>

        <section class="form-container">
            <from action="#" method="post">
                <div class="form-item">
                   <label hospitals for="user_name">Name</label>
                   <input type="text" id="user_name" name="user_name" placeholder="Your Name" required> 
                </div>

                <fieldset>
                    <legend>Message<br>Purpose</legend>
                    <br>
                    <label for="name">Nome:</label> 
                    <input type="radio" name="purpose" value="inquiry"> General Inquiry</label>
                    <label><input type="radio" name="purpose" value="reservation"> Reservation Question</label>
                    <label><input type="radio" name="purpose" value="suggestion"> Website Suggestion</label>
                </fieldset>

                <div class="form-item">
                    <label for="message">Message</label>
                    <textarea id="message" name="message" rows="5" placeholder="Type Here"></textarea>
                </div>

                <div class="form-item checkbox-item">
                    <input type="checkbox" id="newsletter" name="newsletter">
                    <label for="newsletter">Please subscribe me to the monthly newsletter</label>
                </div>

                <button type="submit">Get in Touch!</button>
            </form>

    <section class="employee-profiles">
        <h2>We Are Here to Serve You</h2>
        <div class="profiles-grid">
            <figure>
                <img src="images/employedit.jpg" alt="Profile of Manager">
                <figcaption>John Dallas - Expedition Manager</figcaption>
            </figure>

            <figure>
                <img src="images/employe2.jpg" alt="Profile Lead Guide">
                <figcaption>Smith Rivera - River Guide</figcaption>
            </figure>

            <figure>
                <img src="images/employe3.jpg" alt="Profile of Support">
                <figcaption>Sam Winchester - Costumer Support</figcaption>
            </figure>
        </div>
    </section>
    </main>

    <footer>
        <p>©2026 🚣‍♀️ Dry Oar 🚣‍♀️  Jessica Garrido</p>
        <nav class="socialmedia">
            <a href="https://facebook.com">
                <img src="images/facebooksquare.svg" alt="Icon Facebook">
            </a>
            <a href="https://instagram.com">
                <img src="images/instagramsquare.svg" alt="Icon Instagram">
            </a>
            <a href="https://linkedin.com">
                <img src="images/linkedinsquare.svg" alt="Icon Linkedin">
            </a>
        </nav>
    </footer>
</body>

</html>
