    <main>
        <div class="container">
            <h2>White Water Rafting Company</h2>
             <p>
                123 Main River Street<br>
                Kalandula, Angola<br>
                +1 999 999 9999<br>
                info@whitewater.com
            </p>

             <div class="contact">
                <div class="map">
                    <iframe src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d3939.8884418753755!2d15.998486274061383!3d-9.07392689098914!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x1a4a3a47688540bf%3A0x88e0fddc326b6db0!2sQuedas%20de%20Calandula!5e0!3m2!1spt-PT!2sao!4v1775836546064!5m2!1spt-PT!2sao" width="400" height="350" allowfullscreen="" loading="lazy" referrerpolicy="no-referrer-when-downgrade"></iframe>
                </div>

                <form>
                    <label for="email">Name</label>
                    <input type="text" placeholder="Name">
                    <label for="email">Email</label>
                    <input type="email" placeholder="Email">

                    <label>Message Purpose</label>
                    <label><input type="radio" name="purpose"> General Inquiry</label>
                    <label><input type="radio" name="purpose"> Reservation Question</label>
                    <label><input type="radio" name="purpose"> Website Suggestion</label>
                     
                    <label>Message</label>
                    <textarea placeholder="Menssage"></textarea>

                    <label><input type="checkbox">Please subscribe me to the monthly newsletter</label>

                    <button>Get in Touch!</button>
                </form>
            </div>

            <div class="team">
                <h3>We Are Here to Serve You</h3>

                <div class="team-members">
                    <div class="member">
                        <img src="images/employedit.jpg" alt="Profile of Manager" width="80" height="90">
                        <figcaption>John Dallas - Expedition Manager</figcaption>
                    </div>

                    <div class="member">
                        <img src="images/employe2.jpg" alt="Profile Lead Guide" width="80" height="90">
                        <figcaption>Smith Rivera - River Guide</figcaption>
                    </div>

                    <div class="member">
                        <img src="images/employe3.jpg" alt="Profile of Support" width="80" height="90">

                    </div>
